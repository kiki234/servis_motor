<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servis Motor Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-center mb-4 text-blue-600">Servis Motor Apps</h1>

        <!-- Navigasi Menu -->
        <div class="flex justify-center space-x-2 mb-6">
            <button id="tabForm" onclick="switchMenu('form')" class="px-5 py-2 bg-blue-600 text-white font-bold rounded-lg shadow transition">
                Entri Servis
            </button>
            <button id="tabRiwayat" onclick="switchMenu('riwayat')" class="px-5 py-2 bg-gray-200 text-gray-600 font-bold rounded-lg shadow hover:bg-gray-300 transition">
                Lihat Riwayat
            </button>
        </div>

        <!-- MENU 1: Form Entry -->
        <div id="menuForm" class="block bg-white p-6 rounded-xl shadow-md">
            <h2 class="text-xl font-bold mb-4 border-b pb-2">Catat Servis Baru</h2>
            <form id="servisForm" class="space-y-4">
                <input type="hidden" id="editId">
                
                <div>
                    <label class="block text-sm font-medium mb-1">Tanggal</label>
                    <input type="date" id="inputTanggal" required class="w-full border-gray-300 border p-2 rounded focus:ring focus:ring-blue-200">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Pekerjaan Servis</label>
                    <input type="text" id="inputPekerjaan" list="pekerjaanList" placeholder="Misal: Ganti Oli Gardan, Servis CVT..." required class="w-full border-gray-300 border p-2 rounded focus:ring focus:ring-blue-200">
                    <datalist id="pekerjaanList"></datalist>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Odo Awal (Km)</label>
                        <input type="number" id="odoAwal" required class="w-full border-gray-300 border p-2 rounded focus:ring focus:ring-blue-200" placeholder="0">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Odo Akhir (Km)</label>
                        <input type="number" id="odoAkhir" required class="w-full border-gray-300 border p-2 rounded focus:ring focus:ring-blue-200" placeholder="0">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Selisih Odo (Km)</label>
                    <input type="number" id="selisihOdo" readonly class="w-full bg-gray-200 border-gray-300 border p-2 rounded" placeholder="0">
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Nominal Biaya (Rp)</label>
                    <input type="text" id="inputNominal" required class="w-full border-gray-300 border p-2 rounded focus:ring focus:ring-blue-200" placeholder="10.000">
                </div>

                <div class="flex gap-2 pt-2">
                    <button type="submit" id="btnSubmit" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
                        Simpan Data
                    </button>
                    <button type="button" id="btnCancel" onclick="cancelEdit()" class="hidden w-1/3 bg-gray-500 text-white font-bold py-2 rounded hover:bg-gray-600 transition">
                        Batal
                    </button>
                </div>
            </form>
        </div>

        <!-- MENU 2: Riwayat Servis -->
        <div id="menuRiwayat" class="hidden">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Data Riwayat Servis</h2>
                <div class="space-x-2">
                    <button onclick="exportExcel()" class="bg-green-600 text-white px-3 py-1 text-sm rounded hover:bg-green-700">Excel</button>
                    <button onclick="exportPDF()" class="bg-red-600 text-white px-3 py-1 text-sm rounded hover:bg-red-700">PDF</button>
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-x-auto">
                <table class="w-full text-sm text-left" id="dataTable">
                    <thead class="bg-gray-50 text-gray-700">
                        <tr>
                            <th class="p-3">Tanggal</th>
                            <th class="p-3">Pekerjaan</th>
                            <th class="p-3">Selisih</th>
                            <th class="p-3">Biaya</th>
                            <th class="p-3">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y">
                        <tr><td colspan="5" class="p-4 text-center">Memuat data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // PASTIKAN TANDA KUTIP (' ') DI AWAL DAN AKHIR URL TIDAK TERHAPUS!
        const API_URL = 'https://script.google.com/macros/s/AKfycbxfxqdKHpZ9_axz074oYiUIREcybHwj_KBd816-ebXGYlucbF7z1apHBmkNUbNKI26ksA/exec';
        
        let allData = [];

        // Fitur Switch Menu (Tab)
        function switchMenu(menu) {
            const menuForm = document.getElementById('menuForm');
            const menuRiwayat = document.getElementById('menuRiwayat');
            const tabForm = document.getElementById('tabForm');
            const tabRiwayat = document.getElementById('tabRiwayat');

            if (menu === 'form') {
                menuForm.classList.remove('hidden');
                menuForm.classList.add('block');
                menuRiwayat.classList.remove('block');
                menuRiwayat.classList.add('hidden');

                tabForm.classList.replace('bg-gray-200', 'bg-blue-600');
                tabForm.classList.replace('text-gray-600', 'text-white');
                tabRiwayat.classList.replace('bg-blue-600', 'bg-gray-200');
                tabRiwayat.classList.replace('text-white', 'text-gray-600');
            } else {
                menuRiwayat.classList.remove('hidden');
                menuRiwayat.classList.add('block');
                menuForm.classList.remove('block');
                menuForm.classList.add('hidden');

                tabRiwayat.classList.replace('bg-gray-200', 'bg-blue-600');
                tabRiwayat.classList.replace('text-gray-600', 'text-white');
                tabForm.classList.replace('bg-blue-600', 'bg-gray-200');
                tabForm.classList.replace('text-white', 'text-gray-600');
            }
        }

        // Format Rupiah
        const inputNominal = document.getElementById('inputNominal');
        inputNominal.addEventListener('input', function(e) {
            let value = this.value.replace(/[^,\d]/g, '').toString();
            let split = value.split(',');
            let sisa = split[0].length % 3;
            let rupiah = split[0].substr(0, sisa);
            let ribuan = split[0].substr(sisa).match(/\d{3}/gi);
            if (ribuan) {
                let separator = sisa ? '.' : '';
                rupiah += separator + ribuan.join('.');
            }
            this.value = split[1] !== undefined ? rupiah + ',' + split[1] : rupiah;
        });

        // Kalkulasi Odo
        const odoAwal = document.getElementById('odoAwal');
        const odoAkhir = document.getElementById('odoAkhir');
        const selisihOdo = document.getElementById('selisihOdo');

        function hitungSelisih() {
            const awal = parseInt(odoAwal.value) || 0;
            const akhir = parseInt(odoAkhir.value) || 0;
            selisihOdo.value = Math.max(0, akhir - awal);
        }
        odoAwal.addEventListener('input', hitungSelisih);
        odoAkhir.addEventListener('input', hitungSelisih);

        // Fetch Data
        async function loadData() {
            try {
                const response = await fetch(API_URL);
                allData = await response.json();
                renderTable();
                setupInitialState();
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="5" class="p-4 text-center text-red-500">Gagal memuat data. Cek API URL.</td></tr>';
            }
        }

        function setupInitialState() {
            if (allData.length > 0 && !document.getElementById('editId').value) {
                const lastEntry = allData[allData.length - 1];
                odoAwal.value = lastEntry['Odo Akhir'];
                odoAwal.readOnly = true;
                odoAwal.classList.add('bg-gray-200');
            } else if (!document.getElementById('editId').value) {
                odoAwal.readOnly = false;
                odoAwal.classList.remove('bg-gray-200');
            }

            const pekerjaanList = document.getElementById('pekerjaanList');
            const uniquePekerjaan = [...new Set(allData.map(item => item['Pekerjaan']))];
            pekerjaanList.innerHTML = uniquePekerjaan.map(p => `<option value="${p}">`).join('');
        }

        function displayTanggal(rawDate) {
            if(!rawDate) return '-';
            const d = new Date(rawDate);
            if(isNaN(d)) return rawDate; 
            return d.toLocaleDateString('id-ID', {day: '2-digit', month: 'short', year: 'numeric'});
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            if (allData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center">Belum ada data.</td></tr>';
                return;
            }
            tbody.innerHTML = allData.slice().reverse().map(row => `
                <tr class="hover:bg-gray-50">
                    <td class="p-3">${displayTanggal(row['Tanggal'])}</td>
                    <td class="p-3">${row['Pekerjaan']}</td>
                    <td class="p-3">${row['Selisih Odo']} Km</td>
                    <td class="p-3">Rp ${parseInt(row['Nominal'] || 0).toLocaleString('id-ID')}</td>
                    <td class="p-3 text-xs">
                        <button onclick="editData('${row['ID']}')" class="text-blue-600 font-semibold mr-2 hover:underline">Edit</button>
                        <button onclick="deleteData('${row['ID']}')" class="text-red-600 font-semibold hover:underline">Hapus</button>
                    </td>
                </tr>
            `).join('');
        }

        function editData(id) {
            const dataToEdit = allData.find(item => item['ID'] === id);
            if(!dataToEdit) return;

            switchMenu('form');
            document.getElementById('editId').value = id;
            
            let tgl = dataToEdit['Tanggal'];
            if(tgl) {
                const d = new Date(tgl);
                if(!isNaN(d)) {
                    document.getElementById('inputTanggal').value = d.toISOString().split('T')[0];
                } else {
                    document.getElementById('inputTanggal').value = tgl; 
                }
            }
            
            document.getElementById('inputPekerjaan').value = dataToEdit['Pekerjaan'];
            odoAwal.value = dataToEdit['Odo Awal'];
            odoAkhir.value = dataToEdit['Odo Akhir'];
            inputNominal.value = parseInt(dataToEdit['Nominal']).toLocaleString('id-ID').replace(/\./g, '.');
            
            hitungSelisih();
            odoAwal.readOnly = false;
            odoAwal.classList.remove('bg-gray-200');

            document.getElementById('btnSubmit').innerText = 'Update Data';
            document.getElementById('btnSubmit').classList.replace('bg-blue-600', 'bg-yellow-500');
            document.getElementById('btnSubmit').classList.replace('hover:bg-blue-700', 'hover:bg-yellow-600');
            document.getElementById('btnCancel').classList.remove('hidden');
        }

        function cancelEdit() {
            document.getElementById('servisForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('btnSubmit').innerText = 'Simpan Data';
            document.getElementById('btnSubmit').classList.replace('bg-yellow-500', 'bg-blue-600');
            document.getElementById('btnSubmit').classList.replace('hover:bg-yellow-600', 'hover:bg-blue-700');
            document.getElementById('btnCancel').classList.add('hidden');
            setupInitialState();
        }

        async function deleteData(id) {
            if(!confirm("Yakin ingin menghapus data ini?")) return;
            const payload = { action: 'delete', id: id };
            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });
            await loadData();
        }

        document.getElementById('servisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btnSubmit = document.getElementById('btnSubmit');
            const editId = document.getElementById('editId').value;
            
            btnSubmit.innerText = 'Memproses...';
            btnSubmit.disabled = true;

            const payload = {
                action: editId ? 'update' : 'create',
                id: editId,
                tanggal: document.getElementById('inputTanggal').value, 
                pekerjaan: document.getElementById('inputPekerjaan').value,
                odoAwal: odoAwal.value,
                odoAkhir: odoAkhir.value,
                selisih: selisihOdo.value,
                nominal: inputNominal.value.replace(/\./g, '')
            };

            await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            });

            cancelEdit(); 
            await loadData();
            btnSubmit.disabled = false;
            switchMenu('riwayat');
        });

        function exportExcel() {
            if (allData.length === 0) return alert('Tidak ada data');
            const ws = XLSX.utils.json_to_sheet(allData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Riwayat Servis");
            XLSX.writeFile(wb, "Laporan_Servis_Motor.xlsx");
        }

        function exportPDF() {
            if (allData.length === 0) return alert('Tidak ada data');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("Laporan Riwayat Servis Motor", 14, 15);
            const tableColumn = ["Tanggal", "Pekerjaan", "Odo Awal", "Odo Akhir", "Selisih", "Nominal"];
            const tableRows = [];
            allData.forEach(row => {
                tableRows.push([
                    displayTanggal(row['Tanggal']), row['Pekerjaan'], row['Odo Awal'], 
                    row['Odo Akhir'], row['Selisih Odo'], `Rp ${parseInt(row['Nominal']).toLocaleString('id-ID')}`
                ]);
            });
            doc.autoTable({ head: [tableColumn], body: tableRows, startY: 20 });
            doc.save("Laporan_Servis_Motor.pdf");
        }

        window.onload = loadData;
    </script>
</body>
</html>
